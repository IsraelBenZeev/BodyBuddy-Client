<!DOCTYPE html>
<html dir="rtl" lang="he">
  <body style="margin:0;padding:24px;background:#fafafa;font-family:Arial,Helvetica,sans-serif;direction:rtl;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="560"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="max-width:560px;width:100%;background:#ffffff;border:1px solid #e4e4e7;border-radius:12px;overflow:hidden;"
          >
            <tr>
              <td align="center" style="background:#27272a;padding:28px 24px;">
                <div style="color:#ffffff;font-size:24px;font-weight:700;letter-spacing:0.5px;">BodyBuddy</div>
                <div style="color:#bef264;font-size:12px;margin-top:6px;">השותף שלך להתקדמות</div>
              </td>
            </tr>
            <tr>
              <td dir="rtl" style="padding:32px 28px 12px;text-align:right;">
                <span style="display:inline-block;background:#eff7e1;color:#27272a;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;">
                  אבטחת החשבון
                </span>
                <h1 style="margin:14px 0 0;color:#27272a;font-size:24px;line-height:1.35;">
                  איפוס סיסמה
                </h1>
              </td>
            </tr>
            <tr>
              <td dir="rtl" style="padding:8px 28px 28px;text-align:right;">
                <p style="margin:0;color:#52525b;font-size:16px;line-height:1.7;">
                  התקבלה בקשה לאיפוס הסיסמה לחשבון שלך ב-BodyBuddy. לחץ על הכפתור למטה כדי לבחור סיסמה חדשה.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0;">
                  <tr>
                    <td align="center" bgcolor="#96c828" style="border-radius:8px;">
                      <a
                        href="{{ .ConfirmationURL }}"
                        style="display:inline-block;padding:14px 24px;color:#27272a;font-size:16px;font-weight:700;text-decoration:none;"
                      >
                        בחירת סיסמה חדשה
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="margin:0;color:#71717a;font-size:14px;line-height:1.7;">
                  אם לא ביקשת לאפס את הסיסמה, אפשר להתעלם מהמייל. הסיסמה הקיימת שלך לא תשתנה.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:18px 24px;background:#fafafa;border-top:1px solid #e4e4e7;">
                <span style="color:#71717a;font-size:12px;">נשלח אוטומטית מ-BodyBuddy</span>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
